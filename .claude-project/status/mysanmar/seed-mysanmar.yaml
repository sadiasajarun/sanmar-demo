  - { name: scoring_explainability,  weight: 0.25, note: "Is it obvious WHY a lead got its score, and how a manager changes that?" }
  - { name: visual_quality,          weight: 0.20, note: "Design-system compliance, density, contrast, responsive behaviour" }
  - { name: data_realism,            weight: 0.15, note: "Sanmar-specific, Bangladesh-specific, no lorem ipsum" }
  - { name: structural_integrity,    weight: 0.10, note: "Link resolution, role folders, shared-shell consistency" }

