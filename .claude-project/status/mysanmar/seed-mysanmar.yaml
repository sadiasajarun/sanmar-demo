    - { file: leads.page.html,         title: "All Leads",            purpose: "Master pipeline table, filter by score band/stage/campaign/agent, bulk assign" }
    - { file: review-queue.page.html,  title: "Garbage Review Queue", purpose: "Auto-disqualified leads with reason chips, one-click restore, feedback logging" }
    - { file: scoring-rules.page.html, title: "Scoring Rules",        purpose: "Weight builder for AI + business-fit factors with a live score simulator" }
    - { file: automation.page.html,    title: "Follow-up Automation", purpose: "Trigger/condition/action rules and email sequence templates" }
    - { file: campaigns.page.html,     title: "Campaign Performance", purpose: "Per-source volume, qualified rate, garbage rate, cost per qualified lead" }
    - { file: team.page.html,          title: "Team & Routing",       purpose: "Agent roster, workload, capacity, routing rule configuration" }
  agent:
    - { file: my-leads.page.html,      title: "My Leads",             purpose: "Prioritised personal queue sorted by score with today's follow-ups" }
    - { file: lead-detail.page.html,   title: "Lead Detail",          purpose: "HERO: profile, score breakdown + reasons, call summaries, comms timeline, actions" }
    - { file: call-log.page.html,      title: "Call Log",             purpose: "Recent calls with AI summary, engagement signal, and score delta produced" }
    - { file: followups.page.html,     title: "Follow-ups & Tasks",   purpose: "Due/overdue tasks, scheduled emails, site visit calendar" }

