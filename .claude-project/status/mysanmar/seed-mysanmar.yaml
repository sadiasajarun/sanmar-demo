# Ouroboros seed — MySanmar Lead Intelligence & Sales CRM (demo prototype)
# Generated by /fullstack-pm P1-spec on 2026-09-08
seed_id: seed-mysanmar
project: mysanmar
track: pm
generated_at: "2026-09-08"
ambiguity_score: 0.10

client:
  name: Sanmar Properties Ltd
  site: https://mysanmar.com
  industry: Real estate development (residential apartments, shops, commercial office space)
  founded: 1999
  hq: Sanmar Ocean City (7th Floor), 997 CDA Avenue, East Nasirabad, Chittagong-4000, Bangladesh
  markets: Chittagong (Nasirabad, CDA Avenue, Khulshi, Agrabad, GEC) and Dhaka
  currency: BDT (displayed in lakh / crore)

goal: >
  Produce a clickable HTML demo prototype of a Lead Intelligence and Sales CRM platform for
  Sanmar Properties, which ingests AI-generated call summaries from a third-party call-analysis
  product, scores and qualifies every high-volume marketing lead into garbage vs sales-ready,
  routes only qualified leads to sales agents, and gives those agents and their manager one
  place to run the pipeline, see the full communication history, and automate email follow-ups.

scope:
  in_scope:
    - "Requirement #4: AI-Based Lead Qualification Engine"
    - "Requirement #5: Sales & Marketing CRM / agent portal interface"
    - "Clickable static HTML prototype only — 2 role portals, ~11 pages, realistic Sanmar sample data"
  out_of_scope:
    - "Requirement #1/#2: website click-to-call popup + voice routing (separate existing demo)"
    - "Requirement #3: omnichannel LLM chatbot + smart IVR (separate existing demo)"
    - "Any React / backend implementation — this is the PM track, HTML prototype only"
    - "Real telephony, real STT, real email delivery"
  boundary_note: >
    Points 1-3 are upstream producers of leads and conversations. The prototype acknowledges
    them as inbound sources (source badges, handoff markers) but does not re-demo them.

constraints:
  hard:
    - "Static HTML + CSS (+ minimal vanilla JS for tabs/modals). No build step, opens from file://"
    - "English-only UI. Sample data uses Bangladeshi names, Chittagong locations, BDT lakh/crore"
    - "Two role folders only: design/html/manager/ and design/html/agent/"
    - "Every inter-page link uses a real filename — no placeholder hash navigation"
    - "No emojis as icons — inline SVG only"
    - "Text contrast >= 4.5:1 (WCAG AA); no horizontal scroll at 375px"
    - "Call transcription/analysis is NOT ours — it arrives via webhook from a 3rd-party provider"
  soft:
    - "Should feel like a product a working sales floor would actually use all day"
    - "Density over whitespace on list views — tele-sales staff work high volume"
    - "The lead-detail score breakdown is the hero screen; it must be self-explanatory in a meeting"

decisions:
  D1_lead_origin: >
    Leads do NOT come from the website. They come from high-volume marketing campaigns
    (Facebook, Google, billboards, property fairs, referral) and land as phone calls into
    the tele-sales team.
  D2_call_intelligence: >
    A third-party call-analysis product transcribes and analyses each call and PUSHES the result
    to this system over a webhook: transcript, conversation summary, engagement level, interest
    level, extracted entities (budget, timeline, preferred location/unit). Each call record shows
    a provider source badge. We consume; we do not transcribe.
  D3_scoring_model: >
    Hybrid. AI sub-scores from the call (intent, engagement, sentiment) combine with rule-based
    business-fit scores (budget band, purchase timeline, preferred location match, unit type
    availability, financing readiness). A Sales Manager tunes the weight of every factor in a
    rule builder with a live score simulator. Lead detail shows a stacked breakdown plus
    plain-language "why this score" reasons.
  D4_channels: >
    Calls and Email only in this prototype. WhatsApp/Messenger deferred (they belong to the
    requirement-#3 chatbot demo).
  D5_garbage_handling: >
    Auto-flagged garbage leads go to a Review Queue with the disqualification reason shown,
    not silent deletion. A manager can restore any lead in one click, and that restore is
    logged as a correction/feedback event against the scoring model.
  D6_roles: >
    Two portals. Sales Manager/Admin (pipeline oversight, routing, review queue, scoring rules,
    automation, campaign performance, team) and Sales Agent (my leads, lead detail, call log,
    follow-ups).

ontology:
  Lead: >
    A prospective property buyer captured from a marketing campaign. Carries contact details,
    source campaign, requirement profile (budget, timeline, preferred location, unit type,
    financing), a current score, a qualification verdict and a pipeline stage.
  Call: >
    One telephone conversation with a lead. Enriched by the third-party call-analysis provider
    with duration, transcript, summary, engagement level, interest level and extracted entities.
  CallSummary: >
    The provider-generated narrative of what was discussed on a call, plus the structured signals
    derived from it. The primary raw material for scoring.
  LeadScore: >
    A 0-100 composite. Sum of weighted AI sub-scores (intent, engagement, sentiment) and weighted
    business-fit rule scores (budget, timeline, location, unit type, financing). Recomputed after
    every call and every profile update. Always accompanied by a factor breakdown.
  ScoringRule: >
    A manager-editable factor definition — its input field, its banding/thresholds, and its weight
    in the composite. The set of active rules is the scoring model.
  QualificationVerdict: >
    One of Qualified (route to agent), Nurture (keep warm, automated sequence only),
    or Garbage (send to Review Queue with a reason). Derived from score band plus hard
    disqualifiers (wrong city, no budget, wrong-number, test/spam, competitor, job seeker).
  Campaign: >
    The marketing source that produced a lead — channel, name, spend and period. Used to measure
    lead quality and cost per qualified lead per source.
  PipelineStage: >
    New -> Contacted -> Qualified -> Site Visit Scheduled -> Site Visit Done -> Negotiation ->
    Booked -> Lost. Garbage sits outside the pipeline in the Review Queue.
  CommunicationTimeline: >
    The unified, reverse-chronological record of every touch on a lead — calls (with AI summary),
    emails sent/opened/clicked, notes, stage changes, score changes, assignment changes.
  FollowUpAutomation: >
    A trigger-condition-action rule (e.g. score >= 70 AND no contact in 2 days -> send email
    template X and create an agent task) that runs without human initiation.
  Agent: >
    A member of the sales or tele-sales team who owns qualified leads and works them to booking.
  RoutingRule: >
    How a qualified lead is assigned to an agent — round-robin, by preferred project, by
    territory, or by agent capacity.
  Project: >
    A Sanmar development (e.g. Sanmar Ocean City, Sanmar Ruby Twin) containing available units
    that a lead's preferences are matched against.

personas:
  - id: manager
    label: Sales Manager / Admin
    goal: "Stop wasting the floor's time on garbage leads and see which campaigns actually pay."
    needs: [pipeline oversight, garbage review, scoring control, routing, campaign ROI, team KPIs]
  - id: agent
    label: Sales Agent / Tele-sales
    goal: "Know who to call next and walk into the call already knowing what was said last time."
    needs: [prioritised queue, call summary recap, score reasoning, one-click follow-up, task list]

